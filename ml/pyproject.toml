[project]
name = "safero-ml"
version = "0.1.0"
description = "SafeRo ML Service — Risk intelligence and abuse-ring detection"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
    "networkx>=3.3",
    "pyyaml>=6.0",
    "pydantic>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["."]
pythonPath = "C:\\Users\\burid\\AppData\\Local\\Programs\\Python\\Python313\\python.exe"
reportMissingImports = false
reportMissingModuleSource = false
executionEnvironments = [
    { root = "." }
]
