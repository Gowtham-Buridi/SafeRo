version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: safero-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-safero}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-safero_dev}
      POSTGRES_DB: ${POSTGRES_DB:-safero}
    volumes:
      - safero_pgdata:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-safero}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  safero_pgdata:
